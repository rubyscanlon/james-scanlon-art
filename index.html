<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Paintings by James Scanlon, Los Angeles.">
    <meta name="theme-color" content="#0e0e0c">
    <title>James Scanlon</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500&display=swap">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0e0e0c;
            --placeholder: #151411;
            --text: #f0ece4;
            --dim: #5a5549;
            --accent: #c9a882;
        }

        html { scroll-behavior: smooth; scrollbar-gutter: stable; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        body.lb-open { position: fixed; left: 0; right: 0; overflow: hidden; }

        /* ---- HERO ---- */
        header {
            height: 100vh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            will-change: opacity, transform;
        }

        .artist-name {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(3.2rem, 11vw, 10rem);
            line-height: 0.92;
            letter-spacing: -0.03em;
            color: var(--text);
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: heroIn 1s ease 0.2s forwards;
        }

        .location {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--dim);
            margin-top: 1.5rem;
            opacity: 0;
            animation: heroIn 1s ease 0.6s forwards;
        }

        .scroll-cta {
            position: absolute;
            bottom: 3rem;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            opacity: 0;
            animation: heroIn 1s ease 1.2s forwards;
            cursor: pointer;
            border: none;
            background: none;
            font: inherit;
        }

        .scroll-cta span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--dim);
            transition: color 0.3s;
        }
        .scroll-cta:hover span { color: var(--text); }

        .scroll-arrow {
            width: 20px;
            height: 20px;
            border-right: 1px solid var(--dim);
            border-bottom: 1px solid var(--dim);
            transform: rotate(45deg);
            animation: bobDown 2s ease-in-out infinite;
            transition: border-color 0.3s;
        }
        .scroll-cta:hover .scroll-arrow { border-color: var(--text); }

        @keyframes bobDown {
            0%, 100% { transform: rotate(45deg) translateY(0); }
            50% { transform: rotate(45deg) translateY(5px); }
        }
        @keyframes heroIn { to { opacity: 1; transform: translateY(0); } }

        .divider {
            width: 1px; height: 0; background: var(--dim);
            margin: 0 auto; opacity: 0;
            transition: height 1s ease, opacity 1s ease;
        }
        .divider.visible { height: 60px; opacity: 0.4; }

        /* ---- GALLERY ----
           Items are distributed into fixed columns by the script below (shortest
           column first), so pieces never jump between columns as images load.
           Every <img> carries width/height, so space is reserved before load. */
        .gallery {
            display: grid;
            grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
            column-gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        .gallery .col { min-width: 0; }

        .gallery-item {
            position: relative;
            margin-bottom: 2.5rem;
            overflow: hidden;
            border-radius: 2px;
            background: var(--placeholder);
            cursor: pointer;
        }
        .gallery-item:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transition: opacity 0.6s ease, transform 3s ease;
        }
        .gallery-item img.loaded { opacity: 1; }
        .gallery-item:hover img.loaded { transform: scale(1.005); }

        @media (min-width: 768px) {
            .gallery { column-gap: 3rem; padding: 4rem 2.5rem 6rem; }
            .gallery-item { margin-bottom: 4rem; }
            .tier1 { margin-bottom: 5rem; }
            .tier2 { margin-bottom: 4.5rem; }
        }
        @media (min-width: 1100px) {
            .gallery { column-gap: 4rem; }
        }

        /* ---- LIGHTBOX ---- */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(5,5,4,0.97);
            justify-content: center;
            align-items: center;
            padding: 3rem;
            cursor: zoom-out;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }
        .lightbox.active { display: flex; animation: lbIn 0.25s ease; }
        @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }

        .lightbox img {
            max-width: 94vw;
            max-height: 92vh;
            max-height: 92svh;
            object-fit: contain;
            user-select: none;
            -webkit-user-select: none;
            opacity: 0.35;
            transition: opacity 0.2s ease;
        }
        .lightbox img.ready { opacity: 1; }

        .lb-close {
            position: absolute; top: 1.2rem; right: 1.5rem;
            border: none; background: none; color: var(--dim);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem; letter-spacing: 0.25em;
            text-transform: uppercase; cursor: pointer;
            transition: color 0.2s; padding: 0.5rem; z-index: 1001;
        }
        .lb-close:hover, .lb-close:focus-visible { color: var(--text); }

        .lb-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            border: none; background: none; color: var(--dim);
            font-size: 2rem; line-height: 1; cursor: pointer;
            transition: color 0.2s; z-index: 1001; padding: 1rem;
        }
        .lb-nav:hover, .lb-nav:focus-visible { color: var(--text); }
        .lb-prev { left: 0.5rem; }
        .lb-next { right: 0.5rem; }

        .lb-counter {
            position: absolute; bottom: 1.2rem; left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem; letter-spacing: 0.2em;
            color: var(--dim); z-index: 1001;
        }

        @media (max-width: 767px) {
            .lightbox { padding: 1rem; }
            .lb-nav { display: none; }
        }

        /* ---- FOOTER ---- */
        footer { text-align: center; padding: 2.5rem 2rem 2rem; }
        footer p {
            font-family: 'Syne', sans-serif; font-weight: 600;
            font-size: 0.7rem; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--dim);
        }

        ::selection { background: var(--accent); color: var(--bg); }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .artist-name, .location, .scroll-cta { animation: none; opacity: 1; transform: none; }
            .scroll-arrow { animation: none; }
            .gallery-item img, .lightbox img { transition: none; }
            .lightbox.active { animation: none; }
        }
    </style>
    <noscript><style>.gallery-item img { opacity: 1; }</style></noscript>
</head>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Painting viewer">
        <button class="lb-close" type="button" aria-label="Close">Close</button>
        <button class="lb-nav lb-prev" type="button" aria-label="Previous">&#8249;</button>
        <button class="lb-nav lb-next" type="button" aria-label="Next">&#8250;</button>
        <img src="" alt="" id="lb-img">
        <div class="lb-counter" id="lb-counter" aria-live="polite"></div>
    </div>

    <footer>
        <p>&copy; James Scanlon</p>
    </footer>

    <script>
    (function () {
        'use strict';

        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ---- Scroll CTA ----
        document.getElementById('scrollCta').addEventListener('click', function () {
            document.getElementById('gallery').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
        });

        // ---- Divider ----
        var divider = document.getElementById('divider');
        new IntersectionObserver(function (entries) {
            entries.forEach(function (e) { if (e.isIntersecting) divider.classList.add('visible'); });
        }, { threshold: 0.5 }).observe(divider);

        // ---- Header fade (parallax) ----
        var header = document.querySelector('header');
        var ticking = false;
        function onScroll() {
            if (ticking) return;
            ticking = true;
            window.requestAnimationFrame(function () {
                var h = header.offsetHeight || 1;
                var p = Math.min(window.scrollY / (h * 0.5), 1);
                header.style.opacity = String(1 - p);
                header.style.transform = 'translateY(' + Math.min(window.scrollY * 0.3, h * 0.2) + 'px)';
                header.style.visibility = p >= 1 ? 'hidden' : '';
                ticking = false;
            });
        }
        if (!reduceMotion) {
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }

        // ---- Gallery column layout ----
        var gallery = document.getElementById('gallery');
        var items = Array.prototype.slice.call(gallery.querySelectorAll('.gallery-item'));
        var imgs = items.map(function (it) { return it.querySelector('img'); });
        var currentCols = 0;

        function columnCount() {
            var w = window.innerWidth;
            return w >= 1100 ? 3 : (w >= 768 ? 2 : 1);
        }

        function layout(force) {
            var n = columnCount();
            if (n === currentCols && !force) return;
            currentCols = n;
            gallery.style.setProperty('--cols', n);

            var cols = [], heights = [];
            var frag = document.createDocumentFragment();
            for (var i = 0; i < n; i++) {
                var c = document.createElement('div');
                c.className = 'col';
                frag.appendChild(c);
                cols.push(c);
                heights.push(0);
            }
            gallery.replaceChildren(frag);

            items.forEach(function (item) {
                var k = 0;
                for (var j = 1; j < n; j++) if (heights[j] < heights[k]) k = j;
                cols[k].appendChild(item);
                // width/height attributes make this accurate before the image loads
                heights[k] += item.getBoundingClientRect().height + parseFloat(getComputedStyle(item).marginBottom);
            });
        }

        layout(true);

        var resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                if (document.body.classList.contains('lb-open')) return;
                layout(false);
            }, 120);
        });

        // ---- Image fade-in ----
        imgs.forEach(function (img) {
            function reveal() { img.classList.add('loaded'); }
            if (img.complete && img.naturalWidth > 0) reveal();
            else {
                img.addEventListener('load', reveal, { once: true });
                img.addEventListener('error', reveal, { once: true });
            }
        });

        // ---- Lightbox ----
        var lb = document.getElementById('lightbox');
        var lbImg = document.getElementById('lb-img');
        var lbCounter = document.getElementById('lb-counter');
        var lbClose = lb.querySelector('.lb-close');
        var idx = 0;
        var lockY = 0;
        var lastFocus = null;

        function preload(i) {
            var src = imgs[(i + imgs.length) % imgs.length].dataset.full;
            var im = new Image();
            im.src = src;
        }

        function show(i) {
            idx = (i + imgs.length) % imgs.length;
            var src = imgs[idx].dataset.full;
            lbImg.classList.remove('ready');
            lbImg.alt = imgs[idx].alt;
            lbImg.src = src;
            if (lbImg.complete && lbImg.naturalWidth > 0) lbImg.classList.add('ready');
            lbCounter.textContent = (idx + 1) + ' / ' + imgs.length;
            preload(idx + 1);
            preload(idx - 1);
        }
        lbImg.addEventListener('load', function () { lbImg.classList.add('ready'); });
        lbImg.addEventListener('error', function () { lbImg.classList.add('ready'); });

        function lockScroll() {
            lockY = window.scrollY;
            document.body.style.top = (-lockY) + 'px';
            document.body.classList.add('lb-open');
        }
        function unlockScroll() {
            document.body.classList.remove('lb-open');
            document.body.style.top = '';
            var prev = document.documentElement.style.scrollBehavior;
            document.documentElement.style.scrollBehavior = 'auto';
            window.scrollTo(0, lockY);
            document.documentElement.style.scrollBehavior = prev;
        }

        function openLb(i) {
            lastFocus = document.activeElement;
            lockScroll();
            lb.classList.add('active');
            show(i);
            lbClose.focus();
        }
        function closeLb() {
            if (!lb.classList.contains('active')) return;
            lb.classList.remove('active');
            lbImg.src = '';
            unlockScroll();
            if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (err) { lastFocus.focus(); } }
            layout(false);
        }

        items.forEach(function (item, i) {
            item.addEventListener('click', function () { openLb(i); });
            item.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); }
            });
        });

        lb.addEventListener('click', function (e) {
            if (e.target === lb || e.target === lbImg) closeLb();
        });
        lbClose.addEventListener('click', closeLb);
        lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
        lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });

        document.addEventListener('keydown', function (e) {
            if (!lb.classList.contains('active')) return;
            if (e.key === 'Escape') closeLb();
            else if (e.key === 'ArrowLeft') show(idx - 1);
            else if (e.key === 'ArrowRight') show(idx + 1);
        });

        var tx = 0, ty = 0;
        lb.addEventListener('touchstart', function (e) {
            tx = e.touches[0].clientX; ty = e.touches[0].clientY;
        }, { passive: true });
        lb.addEventListener('touchend', function (e) {
            var dx = tx - e.changedTouches[0].clientX;
            var dy = ty - e.changedTouches[0].clientY;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(dx > 0 ? idx + 1 : idx - 1);
        }, { passive: true });
    })();
    </script>
</body>
